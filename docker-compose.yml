version: "3.8"

services:
  # ChurnGuard FastAPI Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churnguard-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ChurnGuard Streamlit Analytics Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churnguard-dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - CHURNGUARD_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
